name: Kvalitet

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  sjekk:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Statisk konsistens (tokens, klasser, filer, fargetabell, kontrast)
        run: python3 .github/qa/statisk.py

      # Verktøyene installeres utenfor repoet, så vi slipper package.json
      - name: Installer verktøy
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/qa" playwright@1.56.1 axe-core@4.14.0 html-validate@11.16.2

      - name: html-validate
        run: "$RUNNER_TEMP/qa/node_modules/.bin/html-validate -c .github/qa/htmlvalidate.json index.html"

      - name: axe (mørk og lys, 320 og 1100 px, med og uten dialog)
        run: node .github/qa/axe.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/qa/node_modules
