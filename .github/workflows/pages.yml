name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Samle sidefiler
        run: |
          mkdir _site
          cp index.html tokens.css components.css styles.css theme.js _site/
          cp -r fonts _site/fonts
          touch _site/.nojekyll

      - name: Cache-busting for CSS og JS
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -e "s|href=\"tokens.css\"|href=\"tokens.css?v=$v\"|" \
                 -e "s|href=\"components.css\"|href=\"components.css?v=$v\"|" \
                 -e "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" \
                 -e "s|src=\"theme.js\"|src=\"theme.js?v=$v\"|" _site/index.html
          grep -c "?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
